name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned dependency tool and locked packages
        run: |
          python -m pip install uv==0.11.15
          uv sync --frozen --group dev
      - name: Lint, software tests and dataset validation
        run: |
          uv run --frozen --no-sync ruff check .
          uv run --frozen --no-sync pytest
          uv run --frozen --no-sync kmb --dataset datasets/engineering-v2 dataset validate
      - name: Offline simulation pipeline
        run: |
          uv run --frozen --no-sync python -I scripts/run-benchmark.py --config examples/competition/offline-check.json --output reports/ci-offline

# No model credentials, real-agent execution or publishing. Ubuntu CI is a
# software check, not an openKylin platform validation. See Actions for the actual remote CI result.
